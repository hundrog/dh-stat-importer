name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MODULE_VERSION="$(jq -r '.version' module.json)"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"

          echo "Tag version:     ${TAG_VERSION}"
          echo "module.json:     ${MODULE_VERSION}"
          echo "package.json:    ${PACKAGE_VERSION}"

          if [[ "${TAG_VERSION}" != "${MODULE_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match module.json version ${MODULE_VERSION}"
            exit 1
          fi

          if [[ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${PACKAGE_VERSION}"
            exit 1
          fi

      - name: Build release artifacts
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build
          mkdir -p build

          cp -R module.json scripts styles templates lang README.md build/

          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/dh-stat-importer.zip"
          jq --arg url "${DOWNLOAD_URL}" '.download = $url' module.json > build/module.json

          (
            cd build
            zip -r ../dh-stat-importer.zip .
          )

          unzip -l dh-stat-importer.zip

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            ## Install in Foundry VTT

            Use this manifest URL:

            ```text
            https://github.com/${{ github.repository }}/releases/latest/download/module.json
            ```
          files: |
            build/module.json
            dh-stat-importer.zip

      - name: Notify Foundry VTT
        shell: bash
        env:
          FOUNDRY_API_TOKEN: ${{ secrets.FOUNDRY_API_TOKEN }}
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MIN_VERSION=$(jq -r '.compatibility.minimum' module.json)
          VERIFIED_VERSION=$(jq -r '.compatibility.verified' module.json)

          MANIFEST_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/module.json"
          NOTES_URL="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}"

          echo "Notifying Foundry VTT..."
          echo "Version: ${TAG_VERSION}"
          echo "Manifest: ${MANIFEST_URL}"
          echo "Notes: ${NOTES_URL}"

          payload=$(jq -n \
            --arg id "$(jq -r '.id' module.json)" \
            --arg ver "$TAG_VERSION" \
            --arg manifest "$MANIFEST_URL" \
            --arg notes "$NOTES_URL" \
            --arg min "$MIN_VERSION" \
            --arg verified "$VERIFIED_VERSION" \
            '{
              id: $id,
              "dry-run": false,
              release: {
                version: $ver,
                manifest: $manifest,
                notes: $notes,
                compatibility: {
                  minimum: $min,
                  verified: $verified,
                  maximum: ""
                }
              }
            }')

          curl -X POST "https://foundryvtt.com/_api/packages/release_version/" \
               -H "Content-Type: application/json" \
               -H "Authorization: ${FOUNDRY_API_TOKEN}" \
               -d "$payload"
